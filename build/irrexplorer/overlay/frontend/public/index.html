<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta name="color-scheme" content="dark"/>
        <meta
                name="description"
                content="Gain insights and debug your Internet Routing Registry configuration. Hosted by MTLNOG."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"/>
        <title>IRR explorer</title>
    </head>
    <body class="d-flex flex-column vh-100">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <header class="mtlnog-header">
            <div class="mtlnog-header-inner">
                <a class="mtlnog-logo-link" href="https://mtlnog.org/">
                    <img class="mtlnog-logo-mark" src="%PUBLIC_URL%/mtlnog-logo.png" alt="MTLNOG logo" width="605" height="147"/>
                    <span class="mtlnog-logo-text">Montreal Network Operator Group</span>
                </a>
                <nav class="mtlnog-nav">
                    <a class="active" href="/">IRR explorer</a>
                    <a href="https://mtlnog.org/en/events/">Events</a>
                    <a href="https://mtlnog.org/en/#invite">Request an Invite</a>
                </nav>
            </div>
        </header>
        <div id="root"></div>
        <footer class="footer mt-auto py-3 text-end" id="footer"></footer>
    </body>
</html>
