---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# Health checks for the Cilium Gateway API ingress data plane and the Gatus
# synthetic endpoint checks. Motivated by the 2026-08-07 outage where a Cilium
# major upgrade left Envoy with zero TLS certs (empty cilium-secrets) and every
# HTTPS gateway silently reset connections.

tasks:

  health:
    desc: Full gateway + Cilium data-plane + Gatus endpoint health check
    summary: |
      One-shot health report covering the pieces that broke during the
      2026-08-07 Gateway API TLS outage:
        - cilium / cilium-envoy / cilium-operator pod status
        - Envoy loaded TLS certificate count (0 == ingress down)
        - cilium-secrets sync count (Gateway TLS secrets)
        - Gateway Programmed status
        - Gatus endpoint success (which public/internal endpoints are down)
        - Gateway API CRD versions vs. the pinned bootstrap version
    cmds:
      - task: pods
      - task: certs
      - task: secrets
      - task: gateways
      - task: endpoints
      - task: crds

  pods:
    desc: Show Cilium agent / Envoy / operator pod status
    cmds:
      - |
        echo "=== Cilium data-plane pods ==="
        kubectl -n kube-system get pods \
          -l 'k8s-app in (cilium,cilium-envoy)' \
          -o wide --no-headers | awk '{printf "%-24s %-10s %s\n", $1, $3, $7}'
        kubectl -n kube-system get pods -l io.cilium/app=operator \
          --no-headers | awk '{printf "%-24s %-10s\n", $1, $3}'

  certs:
    desc: Show TLS certificates Envoy currently has loaded (0 == ingress broken)
    summary: |
      Queries the Envoy admin interface via cilium-dbg. During the outage this
      returned an empty list; healthy state shows one cert per Gateway listener.
    cmds:
      - |
        AGENT=$(kubectl -n kube-system get pod -l k8s-app=cilium -o name | head -1)
        if [ -z "$AGENT" ]; then echo "No cilium agent pod found"; exit 1; fi
        echo "=== Envoy loaded TLS certificates ==="
        DUMP=$(kubectl -n kube-system exec "${AGENT##*/}" -- cilium-dbg envoy admin certs 2>/dev/null)
        COUNT=$(echo "$DUMP" | jq '.certificates | length')
        echo "loaded certificates: ${COUNT}"
        echo "$DUMP" | jq -r '.certificates[].cert_chain[]? | "  serial=\(.serial_number) days_until_expiration=\(.days_until_expiration)"'
        if [ "${COUNT}" = "0" ]; then
          echo "!! Envoy has NO certificates - Gateway HTTPS is down (check cilium-secrets / Gateway API CRDs)"
          exit 1
        fi

  secrets:
    desc: Show Gateway TLS secrets synced into cilium-secrets
    cmds:
      - |
        echo "=== cilium-secrets (synced Gateway TLS) ==="
        COUNT=$(kubectl -n cilium-secrets get secrets --no-headers 2>/dev/null | grep -c . || echo 0)
        echo "synced secrets: ${COUNT}"
        kubectl -n cilium-secrets get secrets --no-headers 2>/dev/null | awk '{print "  " $1}'
        if [ "${COUNT}" = "0" ]; then
          echo "!! cilium-secrets is EMPTY - operator Gateway API secret-sync not running (check Gateway API CRD versions)"
          exit 1
        fi

  gateways:
    desc: Show Gateway Programmed status and addresses
    cmds:
      - |
        echo "=== Gateways ==="
        kubectl -n kube-system get gateways \
          -o custom-columns='NAME:.metadata.name,CLASS:.spec.gatewayClassName,PROGRAMMED:.status.conditions[?(@.type=="Programmed")].status,ADDRESS:.status.addresses[0].value'

  endpoints:
    desc: Show Gatus synthetic endpoint status (0 == failing)
    summary: |
      Reads gatus_results_endpoint_success from Prometheus. These checks hit the
      public URLs through Cloudflare -> tunnel -> external gateway, so they cover
      the real ingress path. Uses an ephemeral curl pod because the Prometheus
      container is distroless.
    cmds:
      - |
        echo "=== Gatus endpoint status (via Prometheus) ==="
        JSON=$(kubectl -n observability run gatus-check-$$ --rm -i --restart=Never \
          --image=curlimages/curl --timeout=30s --quiet -- \
          curl -s 'http://kube-prometheus-stack-prometheus:9090/api/v1/query?query=gatus_results_endpoint_success' 2>/dev/null)
        echo "$JSON" | jq -r '
          .data.result
          | sort_by(.metric.group, .metric.name)[]
          | "\(if .value[1]=="0" then "DOWN" else "up  " end)  [\(.metric.group)] \(.metric.name)"'
        DOWN=$(echo "$JSON" | jq '[.data.result[] | select(.value[1]=="0")] | length')
        echo "---"
        echo "endpoints down: ${DOWN}"

  crds:
    desc: Check installed Gateway API CRD versions against the pinned bootstrap version
    summary: |
      Gateway API CRDs are installed by scripts/bootstrap-apps.sh, which runs
      once at bootstrap and is NOT Flux-managed. Renovate bumps the pinned
      version in that script, but nothing re-applies it, so the cluster drifts
      behind silently.

      That drift is not cosmetic: Cilium major upgrades raise the Gateway API
      version the operator requires, and when the required version is missing
      the operator aborts Gateway API init. Secret-sync never registers,
      cilium-secrets stays empty, Envoy loads zero TLS certs, and every HTTPS
      gateway resets connections. That was the 2026-08-07 outage.

      Compares every installed gateway.networking.* CRD's bundle-version
      annotation against the version pinned in the bootstrap script. Any
      mismatch is drift, in either direction:
        - older than pinned  -> a Renovate bump was never applied to the cluster
        - not in the bundle  -> an orphan upstream removed; apply can never
                                clean it up, only an explicit delete can

      Fix drift by applying the pinned version, then restarting the operator so
      its one-shot resource check re-runs:
        kubectl apply --server-side -f \
          https://github.com/kubernetes-sigs/gateway-api/releases/download/<pinned>/experimental-install.yaml
        kubectl -n kube-system rollout restart deployment/cilium-operator
    cmds:
      - |
        echo "=== Gateway API CRD versions ==="
        SCRIPT="{{.SCRIPTS_DIR}}/bootstrap-apps.sh"
        if [ ! -f "$SCRIPT" ]; then
          echo "!! bootstrap script not found: $SCRIPT"
          exit 1
        fi
        PINNED=$(grep -oE 'gateway-api/releases/download/v[0-9]+\.[0-9]+\.[0-9]+' "$SCRIPT" \
          | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
        if [ -z "$PINNED" ]; then
          echo "!! could not parse the pinned gateway-api version from $SCRIPT"
          exit 1
        fi
        echo "pinned (scripts/bootstrap-apps.sh): ${PINNED}"
        INSTALLED=$(kubectl get crd -o json | jq -r --arg p "$PINNED" '
          .items[]
          | select(.spec.group | test("^gateway\\.networking\\."))
          | (.metadata.annotations["gateway.networking.k8s.io/bundle-version"] // "NONE") as $v
          | "\(if $v == $p then "ok  " else "DRIFT" end)  \($v)  \(.metadata.name)"' | sort)
        if [ -z "$INSTALLED" ]; then
          echo "!! no gateway.networking.* CRDs installed at all - Gateway API is not bootstrapped"
          exit 1
        fi
        echo "$INSTALLED" | awk '{printf "  %s  %-8s %s\n", $1, $2, $3}'
        DRIFTED=$(echo "$INSTALLED" | grep -c '^DRIFT' || true)
        echo "---"
        echo "installed: $(echo "$INSTALLED" | grep -c .)   drifted: ${DRIFTED}"
        if [ "${DRIFTED}" != "0" ]; then
          echo "!! Gateway API CRDs do not match the pinned version - see 'task gateway:crds --summary'"
          exit 1
        fi
