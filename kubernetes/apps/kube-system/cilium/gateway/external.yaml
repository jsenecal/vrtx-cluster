---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    external-dns.alpha.kubernetes.io/target: &hostname vrtx.${SECRET_DOMAIN}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.168.210
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: *hostname,vrtx.${SECRET_DOMAIN_2}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-domain-two
      protocol: HTTP
      port: 80
      hostname: "*.${SECRET_DOMAIN_2}"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-domain-three
      protocol: HTTP
      port: 80
      hostname: "*.${SECRET_DOMAIN_3}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
            namespace: kube-system
    - name: https-domain-two
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN_2}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN_2/./-}-production-tls
            namespace: kube-system
    - name: https-domain-three
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN_3}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN_3/./-}-production-tls
            namespace: kube-system
