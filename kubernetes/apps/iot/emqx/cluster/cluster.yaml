---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps.emqx.io/emqx_v2beta1.json
apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: emqx
spec:
  image: public.ecr.aws/emqx/emqx:5.8.6
  config:
    data: |
      authentication {
        backend = "built_in_database"
        mechanism = "password_based"
        password_hash_algorithm {
            name = "bcrypt"
        }
        user_id_type = "username"
        bootstrap_file = "/opt/init-user.json"
        bootstrap_type = "plain"
      }
      authorization {
        sources = [
          {
            type = built_in_database
            enable = true
          }
        ]
        no_match: "deny"
      }
      listeners.ws.default {
        bind = "0.0.0.0:8083"
        mqtt.path = "/mqtt"
      }
      listeners.wss.default {
        bind = "0.0.0.0:8084"
        mqtt.path = "/mqtt"
        ssl_options {
          keyfile = "/opt/emqx/etc/certs/tls.key"
          certfile = "/opt/emqx/etc/certs/tls.crt"
        }
      }
  coreTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      replicas: 2
      envFrom:
        - secretRef:
            name: emqx-secret
      extraVolumeMounts:
        - name: init-user
          mountPath: /opt/init-user.json
          subPath: init-user.json
          readOnly: true
        - name: tls-certs
          mountPath: /opt/emqx/etc/certs
          readOnly: true
      extraVolumes:
        - name: init-user
          secret:
            secretName: emqx-init-user-secret
        - name: tls-certs
          secret:
            secretName: emqx-tls-secret
      volumeClaimTemplates:
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 2Gi
        accessModes:
          - ReadWriteOnce
  listenersServiceTemplate:
    metadata:
      annotations:
        lbipam.cilium.io/ips: 192.168.252.200,192.168.8.200
    spec:
      type: LoadBalancer
