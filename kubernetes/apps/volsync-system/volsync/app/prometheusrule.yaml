---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          expr: |
            absent(up{job="volsync-metrics"})
          annotations:
            summary: >-
              VolSync component has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        - alert: VolSyncVolumeOutOfSync
          expr: |
            volsync_volume_out_of_sync == 1
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume is out of sync
          for: 5m
          labels:
            severity: critical

        - alert: VolSyncJobRunningTooLong
          expr: |
            (time() - kube_job_status_start_time{job_name=~"volsync-src-plex.*"} > 86400) OR
            (time() - kube_job_status_start_time{job_name=~"volsync-.*", job_name!~"volsync-src-plex.*"} > 14400)
          annotations:
            summary: >-
              VolSync job {{ $labels.namespace }}/{{ $labels.job_name }} has been running for too long
            description: >-
              Job runtime: {{ (time() - $labels.start_time) | humanizeDuration }}. 
              Expected: < 4 hours (< 24 hours for Plex).
              Check if the job is making progress:
              kubectl -n {{ $labels.namespace }} logs -l job-name={{ $labels.job_name }} --tail=20
              If stuck, run: task volsync:unlock NAMESPACE={{ $labels.namespace }} APP={{ $labels.job_name | reReplaceAll "volsync-src-(.*?)-.*" "${1}" }}
          for: 15m
          labels:
            severity: warning

        - alert: VolSyncBackupFailed
          expr: |
            kube_job_status_failed{job_name=~"volsync-.*"} > 0
          annotations:
            summary: >-
              VolSync job {{ $labels.namespace }}/{{ $labels.job_name }} has failed
            description: >-
              Check logs with: kubectl -n {{ $labels.namespace }} logs -l job-name={{ $labels.job_name }}
          for: 5m
          labels:
            severity: critical

        - alert: VolSyncBackupNotRunning
          expr: |
            time() - volsync_replication_source_next_sync_time > 10800
          annotations:
            summary: >-
              VolSync backup for {{ $labels.obj_namespace }}/{{ $labels.obj_name }} is overdue by more than 3 hours
            description: >-
              Next sync was scheduled {{ (time() - $value) | humanizeDuration }} ago but hasn't started.
              Check: task volsync:status | grep {{ $labels.obj_name }}
          for: 30m
          labels:
            severity: warning

        - alert: VolSyncJobStuck
          expr: |
            (time() - kube_job_status_start_time{job_name=~"volsync-.*"} > 7200) AND
            (rate(container_cpu_usage_seconds_total{pod=~"volsync-.*"}[15m]) < 0.0001) AND
            (rate(container_network_transmit_bytes_total{pod=~"volsync-.*"}[15m]) < 1000)
          annotations:
            summary: >-
              VolSync job {{ $labels.namespace }}/{{ $labels.pod }} appears stuck (no activity)
            description: >-
              Job has been running for over 2 hours with minimal CPU and network activity in the last 15 minutes.
              This likely indicates a deadlock. Check logs: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --tail=50
          for: 30m
          labels:
            severity: warning
