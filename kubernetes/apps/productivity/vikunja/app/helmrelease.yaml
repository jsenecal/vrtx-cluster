---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      vikunja:
        containers:
          app:
            image:
              repository: ghcr.io/go-vikunja/vikunja
              tag: latest@sha256:a96c20c0997bae4a445bf717002328524c5449c2b64391032c671ff4e1d8b2fa # v2.2.2
            env:
              VIKUNJA_SERVICE_PUBLICURL: "https://todo.${SECRET_DOMAIN}"
              VIKUNJA_SERVICE_TIMEZONE: America/Toronto
              VIKUNJA_DATABASE_TYPE: sqlite
              VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
              VIKUNJA_FILES_BASEPATH: /app/vikunja/files/files
            envFrom:
              - secretRef:
                  name: vikunja-secret
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /health
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: vikunja
        ports:
          http:
            port: 3456
    route:
      app:
        hostnames:
          - "todo.${SECRET_DOMAIN}"
        parentRefs:
          - name: external-lab
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 3456
    persistence:
      data:
        enabled: true
        existingClaim: vikunja
        globalMounts:
          - path: /app/vikunja/files
      tmp:
        type: emptyDir
