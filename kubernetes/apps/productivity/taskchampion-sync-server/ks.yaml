---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/
# kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app taskchampion-sync-server
  namespace: flux-system
spec:
  targetNamespace: productivity
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/productivity/taskchampion-sync-server/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  components:
    - ../../../../components/gatus/internal
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: taskchampion
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
