---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 5m
  target:
    name: cross-seed-secret
    template:
      data:
        config.js: |-
          // Indexers are opt-in: only Prowlarr indexers tagged `cross-seed` are used.
          // An untagged Prowlarr means zero indexers, not an error.
          function fetchIndexers(baseUrl, apiKey, tag) {
            const buffer = require('child_process').execSync(`curl -fsSL "$${baseUrl}/api/v1/tag/detail?apikey=$${apiKey}"`);
            const response = JSON.parse(buffer.toString('utf8'));
            const indexerIds = response.filter(t => t.label === tag)[0]?.indexerIds ?? [];
            const indexers = indexerIds.map(i => `$${baseUrl}/$${i}/api?apikey=$${apiKey}`);
            console.log(`Loaded $${indexers.length} indexers from Prowlarr`);
            return indexers;
          }

          // Encoded rather than interpolated raw so credentials containing URL
          // sub-delimiters cannot corrupt the RPC endpoint.
          const transmissionUser = encodeURIComponent("{{ .TRANSMISSION_USERNAME }}");
          const transmissionPass = encodeURIComponent("{{ .TRANSMISSION_PASSWORD }}");

          module.exports = {
            action: "inject",
            apiKey: "{{ .CROSS_SEED_API_KEY }}",
            port: Number(process.env.CROSS_SEED_PORT),

            // Searchees come from Transmission over RPC. `torrentDir` is the
            // legacy on-disk alternative and is deliberately unused, which is why
            // Transmission's /config/torrents is not mounted.
            useClientTorrents: true,
            torrentDir: null,
            torrentClients: [`transmission:http://$${transmissionUser}:$${transmissionPass}@192.168.168.4:30096/transmission/rpc`],

            // /downloads is mounted at the same path Transmission uses, so injected
            // download-dir values resolve natively on the NAS. linkDirs must stay on
            // the downloads export: cross-seed picks a linkDir by matching st_dev,
            // and media/ is a separate export that hardlinks cannot reach.
            linkDirs: ["/downloads/cross-seed"],
            linkType: "hardlink",
            matchMode: "partial",
            skipRecheck: true,

            // Metadata lookup only (TVDB/IMDb id resolution). These do not add
            // library files as searchees.
            // Short service names are required, not FQDNs: the *arr AllowedHosts
            // lists contain `<app>` and `<app>.k8s.<domain>` only, so a request to
            // <app>.media-services.svc.cluster.local is rejected with HTTP 400.
            sonarr: ["http://sonarr/?apikey={{ .SONARR_API_KEY }}"],
            radarr: ["http://radarr/?apikey={{ .RADARR_API_KEY }}"],

            torznab: fetchIndexers("http://prowlarr", "{{ .PROWLARR_API_KEY }}", "cross-seed"),

            // No periodic mass search: ~3.2k seeding torrents against 2 indexers
            // would query for well over a day per pass. Trigger a deliberate
            // backfill with POST /api/job?name=search instead.
            rssCadence: "30 minutes",
            excludeOlder: "2 weeks",
            excludeRecentSearch: "3 days"
          };
  dataFrom:
    - extract:
        key: cross-seed
    - extract:
        key: prowlarr
    - extract:
        key: radarr
    - extract:
        key: sonarr
