---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 5m
  target:
    name: cross-seed-secret
    template:
      data:
        config.js: |-
          // Indexers are opt-in: only Prowlarr indexers tagged `cross-seed` are used.
          // An untagged Prowlarr means zero indexers, not an error.
          function fetchIndexers(baseUrl, apiKey, tag) {
            const buffer = require('child_process').execSync(`curl -fsSL "$${baseUrl}/api/v1/tag/detail?apikey=$${apiKey}"`);
            const response = JSON.parse(buffer.toString('utf8'));
            const indexerIds = response.filter(t => t.label === tag)[0]?.indexerIds ?? [];
            const indexers = indexerIds.map(i => `$${baseUrl}/$${i}/api?apikey=$${apiKey}`);
            console.log(`Loaded $${indexers.length} indexers from Prowlarr`);
            return indexers;
          }

          // Built from the existing 1Password `transmission` item so the endpoint and
          // credentials keep a single source of truth. The URL setters percent-encode,
          // so a password containing URL sub-delimiters cannot corrupt the endpoint.
          // The trailing slash is normalised: new URL("rpc", base) would otherwise
          // resolve against the parent path if the stored URL lacked one.
          const transmissionRpc = new URL("rpc", "{{ .TRANSMISSION_URL }}".replace(/\/*$/, "/"));
          transmissionRpc.username = "{{ .TRANSMISSION_USERNAME }}";
          transmissionRpc.password = "{{ .TRANSMISSION_PASSWORD }}";

          module.exports = {
            action: "inject",
            apiKey: "{{ .CROSS_SEED_API_KEY }}",
            port: Number(process.env.CROSS_SEED_PORT),

            // Searchees come from Transmission over RPC. `torrentDir` is the
            // legacy on-disk alternative and is deliberately unused, which is why
            // Transmission's /config/torrents is not mounted.
            useClientTorrents: true,
            torrentDir: null,
            // Both clients: Transmission holds the legacy torrents, qBittorrent
            // receives everything the *arrs grab from now on. cross-seed injects a
            // match back into whichever client holds the source torrent. qBittorrent
            // needs no credentials - its subnet whitelist covers the pod network.
            // Both save under /downloads/complete, so the single linkDir below is on
            // the right filesystem for either one.
            torrentClients: [
              `transmission:$${transmissionRpc.href}`,
              "qbittorrent:http://192.168.168.4:30024"
            ],

            // The linkDir must sit under /downloads/complete, NOT /downloads.
            // Transmission bind-mounts `complete` and `incomplete` individually, so
            // inside its container /downloads is the container's own filesystem
            // (29 TiB) while /downloads/complete is the NAS dataset (83.6 TiB).
            // A linkDir at /downloads/cross-seed is invisible to the client, which
            // then reports 0% and tries to re-download the data it already has.
            // /downloads/complete/cross-seed shares st_dev with the source data, so
            // hardlinks still work, and qBittorrent's save_path is its parent.
            linkDirs: ["/downloads/complete/cross-seed"],
            linkType: "hardlink",
            matchMode: "partial",
            // Must stay false for Transmission: it has no "assume complete" flag, so
            // without cross-seed's stop+torrent-verify an injected torrent sits at 0%
            // and leeches data it already holds.
            skipRecheck: false,

            // Metadata lookup only (TVDB/IMDb id resolution). These do not add
            // library files as searchees.
            // Short service names are required, not FQDNs: the *arr AllowedHosts
            // lists contain `<app>` and `<app>.k8s.<domain>` only, so a request to
            // <app>.media-services.svc.cluster.local is rejected with HTTP 400.
            sonarr: ["http://sonarr/?apikey={{ .SONARR_API_KEY }}"],
            radarr: ["http://radarr/?apikey={{ .RADARR_API_KEY }}"],

            torznab: fetchIndexers("http://prowlarr", "{{ .PROWLARR_API_KEY }}", "cross-seed"),

            // No periodic mass search: ~3.2k seeding torrents against 2 indexers
            // would query for well over a day per pass. Trigger a deliberate
            // backfill with POST /api/job?name=search instead.
            rssCadence: "30 minutes",
            excludeOlder: "2 weeks",
            excludeRecentSearch: "3 days"
          };
  dataFrom:
    - extract:
        key: cross-seed
    - extract:
        key: transmission
    - extract:
        key: prowlarr
    - extract:
        key: radarr
    - extract:
        key: sonarr
