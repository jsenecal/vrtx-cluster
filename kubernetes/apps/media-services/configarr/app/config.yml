---
sonarr:
  main:
    base_url: http://sonarr
    api_key: !env SONARR_API_KEY
    delete_unmanaged_custom_formats:
      enabled: false
    delete_unmanaged_quality_profiles:
      enabled: false
    # Opt-in French profile; existing profiles are left untouched.
    quality_profiles:
      - name: French
        score_set: french-multi-vf
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray|WEB 2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray|WEB 2160p
            qualities:
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray|WEB 1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
    # Language scores are 2000 apart so they outrank release-group tiers (max 1950).
