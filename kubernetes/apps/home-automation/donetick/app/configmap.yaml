---
apiVersion: v1
kind: ConfigMap
metadata:
  name: donetick-config
data:
  selfhosted.yaml: |
    jwt:
      secret: ${DT_JWT_SECRET}
    
    server:
      host: 0.0.0.0
      port: 2021
      cors_allow_origins: ${DT_SERVER_CORS_ALLOW_ORIGINS}
    
    database:
      path: /donetick-data/donetick.db
