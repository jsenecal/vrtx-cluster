---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "multus-system",
                "ips": ["192.168.252.250/24"],
                "mac": "3e:59:e4:f7:43:08"
              },
              {
                "name":"multus-lan",
                "namespace": "multus-system",
                "ips": ["192.168.254.250/24"],
                "mac": "3e:59:e4:f7:43:09"
              }]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65533
            fsGroup: 65533
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.6.3
            env:
              VENV_FOLDER: /venv
            lifecycle:
              postStart:
                exec:
                  command:
                    - sh
                    - -c
                    - chmod -R g+w /config/themes 2>/dev/null || true
            resources:
              requests:
                cpu: 47m
                memory: 2Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.123.0@sha256:6d46b83ea0687ab1826ec029b6d0e6342bbd55cc5c29b98258463e7faee16d1e
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /config/.code-server
              - --extensions-dir
              - /config/.code-server
              - --port
              - "12321"
              - /config
            env:
              HASS_SERVER: http://localhost:8123
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 8Gi

          git-sync:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.0@sha256:d232fd13474ba1b46dba431af2b1411b9d9afacda55ae644d2a32e43975128dd
            env:
              GITSYNC_REPO: https://github.com/jsenecal/home-assistant-yaml
              GITSYNC_REF: main
              GITSYNC_ROOT: /git
              GITSYNC_LINK: repo
              GITSYNC_PERIOD: 30s
              HOME: /tmp
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
            primary: true
          code-server:
            port: 12321

    persistence:
      config:
        existingClaim: home-assistant
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            code-server:
              - path: /config
      hass-cache:
        existingClaim: hass-cache
        advancedMounts:
          home-assistant:
            app:
              - path: /venv
                subPath: hass-venv
      hass-config-src:
        type: emptyDir
        advancedMounts:
          home-assistant:
            git-sync:
              - path: /git
            app:
              - path: /config/hass-config-src
                readOnly: true
      lovelace-maximalist:
        type: configMap
        name: home-assistant-lovelace-maximalist
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages/lovelace_maximalist.yaml
                subPath: lovelace_maximalist.yaml
                readOnly: true
      psychrometry-assets:
        type: configMap
        name: home-assistant-psychrometry-assets
        advancedMounts:
          home-assistant:
            app:
              - path: /config/www/psychrometry-chart.svg
                subPath: psychrometry-chart.svg
                readOnly: true
              - path: /config/www/psychrometry-chart.css
                subPath: psychrometry-chart.css
                readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
                subPath: hass-tmp
            code-server:
              - path: /tmp
                subPath: code-server-tmp
              - path: /nonexistent
                subPath: nonexistent
            git-sync:
              - path: /tmp
                subPath: git-sync-tmp

    route:
      internal:
        hostnames:
          - "{{ .Release.Name }}.k8s.${SECRET_DOMAIN}"
          - "haus.k8s.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /code/
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - name: home-assistant
                port: 12321
          - backendRefs:
              - name: home-assistant
                port: 8123
      app:
        hostnames:
          - "haus.${SECRET_DOMAIN}"
        parentRefs:
          - name: external-lab
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: home-assistant
                port: 8123
