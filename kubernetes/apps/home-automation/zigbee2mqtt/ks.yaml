  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/home-automation/zigbee2mqtt/basement"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
    - name: emqx-cluster
      namespace: iot
    - name: volsync
      namespace: volsync-system
  components:
    - ../../../../components/volsync
    - ../../../../components/gatus/iot
  postBuild:
    substitute:
      APP: *appname
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
