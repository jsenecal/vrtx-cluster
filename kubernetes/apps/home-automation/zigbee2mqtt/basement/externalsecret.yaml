---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: z2m-b
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  dataFrom:
    - extract:
        key: zigbee2mqtt
  target:
    name: z2m-b-secrets
    creationPolicy: Owner
    template:
      data:
        mqtt_user: "{{ .MQTT_USERNAME }}"
        mqtt_password: "{{ .MQTT_PASSWORD }}"
        zigbee_network_key: "[89,214,31,222,245,31,139,166,105,100,85,225,220,122,144,34]"
        zigbee_pan_id: "43090"
        zigbee_ext_pan_id: "[135,74,11,209,181,70,231,111]"
