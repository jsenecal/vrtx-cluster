---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname ha-mcp
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/home-automation/ha-mcp/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: home-assistant
      namespace: home-automation
  components:
    - ../../../../components/gatus/public
  postBuild:
    substitute:
      APP: *appname
      GATUS_PATH: /.well-known/oauth-authorization-server
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
