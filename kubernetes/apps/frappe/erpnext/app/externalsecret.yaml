---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: erpnext-secret
    template:
      engineVersion: v2
      data:
        # Database connection
        db-host: mariadb-galera.db.svc.cluster.local
        db-port: "3306"
        db-name: erpnext
        db-user: erpnext
        db-password: "{{ .mariadb_password }}"
        
        # Redis connection
        redis-cache-host: redis-cache-main.frappe.svc.cluster.local
        redis-cache-port: "6379"
        redis-queue-host: redis-queue-main.frappe.svc.cluster.local
        redis-queue-port: "6379"
        
        # ERPNext specific
        admin-password: "{{ .erpnext_admin_password }}"
        encryption-key: "{{ .erpnext_encryption_key }}"
        
  dataFrom:
    - extract:
        key: erpnext