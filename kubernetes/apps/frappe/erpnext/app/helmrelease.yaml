---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app erpnext
spec:
  interval: 30m
  chart:
    spec:
      chart: erpnext
      version: "7.0.126"
      sourceRef:
        kind: HelmRepository
        name: erpnext
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Use external database
    mariadb:
      enabled: false
    
    # Use external redis
    redis-cache:
      enabled: false
    redis-queue:
      enabled: false
    redis-socketio:
      enabled: false
    
    # External database configuration
    dbHost: mariadb-galera.db.svc.cluster.local
    dbPort: 3306
    dbRootUser: root
    dbRootPassword:
      valueFrom:
        secretKeyRef:
          name: erpnext-db-secret
          key: root-password
    
    # External redis configuration
    redisQueueHost: redis-main.frappe.svc.cluster.local
    redisCacheHost: redis-main.frappe.svc.cluster.local
    redisSocketIOHost: redis-main.frappe.svc.cluster.local
    
    # ERPNext site configuration
    createSite:
      enabled: true
      siteName: erp.${SECRET_DOMAIN_2}
      adminPassword:
        valueFrom:
          secretKeyRef:
            name: erpnext-secret
            key: admin-password
      installApps:
        - "erpnext"
      dbType: mariadb
      # The Helm chart will create a database named after the site
      
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ceph-filesystem
      
    # Ingress configuration
    ingress:
      enabled: false  # We'll use HTTPRoute instead
      
    # Worker configuration
    worker:
      gunicorn:
        replicaCount: 2
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
      default:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      long:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      short:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      scheduler:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
    
    nginx:
      replicaCount: 2
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
          
    socketio:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi