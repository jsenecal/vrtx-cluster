---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app erpnext
spec:
  interval: 30m
  chart:
    spec:
      chart: erpnext
      version: "7.0.126"
      sourceRef:
        kind: HelmRepository
        name: erpnext
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Use external database
    mariadb:
      enabled: false
    
    # Use external redis
    redis-cache:
      enabled: false
      host: "redis://redis.frappe.svc.cluster.local:6379"
    redis-queue:
      enabled: false
      host: "redis://redis.frappe.svc.cluster.local:6379"
    redis-socketio:
      enabled: false
    
    # External database configuration
    dbHost: mariadb-galera.frappe.svc.cluster.local
    dbPort: 3306
    dbRootUser: root
    # Reference to existing secret for DB password
    dbExistingSecret: erpnext-db-secret
    dbExistingSecretPasswordKey: root-password
    
    # External redis configuration
    redisQueueHost: redis.frappe.svc.cluster.local
    redisCacheHost: redis.frappe.svc.cluster.local
    redisSocketIOHost: redis.frappe.svc.cluster.local
    
    # Jobs configuration
    jobs:
      createSite:
        enabled: false  # Disable auto-creation, we'll handle it differently
      
    persistence:
      worker:
        enabled: true
        size: 20Gi
        storageClass: ceph-filesystem
      
    # Ingress configuration
    ingress:
      enabled: false  # We'll use HTTPRoute instead
      
    # Worker configuration
    worker:
      gunicorn:
        replicaCount: 2
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
      default:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      long:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      short:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      scheduler:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
    
    nginx:
      replicaCount: 2
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
          
    socketio:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi