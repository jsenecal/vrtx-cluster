---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erpnext-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: erpnext
        group: Public Services
        url: https://erp.${SECRET_DOMAIN_2}/
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord