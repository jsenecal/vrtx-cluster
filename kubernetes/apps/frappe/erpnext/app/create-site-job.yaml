---
apiVersion: batch/v1
kind: Job
metadata:
  name: erpnext-create-site
  labels:
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/component: site-creation
  annotations:
    # This annotation tells Flux to ignore this resource after initial creation
    kustomize.toolkit.fluxcd.io/reconcile: disabled
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: create-site
        image: frappe/erpnext:v15.95.1
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            cd /home/frappe/frappe-bench

            # Check if site already exists
            if [ -d "sites/erp.loopnetworks.ca" ]; then
              echo "Site already exists, skipping creation"
              exit 0
            fi

            # Create the site
            bench new-site erp.loopnetworks.ca \
              --mariadb-root-username root \
              --mariadb-root-password "$DB_ROOT_PASSWORD" \
              --admin-password "$ADMIN_PASSWORD" \
              --db-host mariadb-galera.frappe.svc.cluster.local \
              --db-port 3306 \
              --install-app erpnext

            # Fix database permissions to allow access from any pod IP
            # Get the database name from site config
            DB_NAME=$(cd sites/erp.loopnetworks.ca && cat site_config.json | grep db_name | cut -d'"' -f4)
            DB_PASS=$(cd sites/erp.loopnetworks.ca && cat site_config.json | grep db_password | cut -d'"' -f4)

            # Grant permissions from any pod in the cluster
            mysql -h mariadb-galera.frappe.svc.cluster.local -uroot -p"$DB_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON ${DB_NAME}.* TO '${DB_NAME}'@'10.42.%' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;"

            # Set as default site
            bench use erp.loopnetworks.ca
        env:
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erpnext-db-secret
              key: root-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erpnext-secret
              key: admin-password
        volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
        - name: assets
          mountPath: /home/frappe/frappe-bench/sites/assets
        securityContext:
          capabilities:
            add:
            - CAP_CHOWN
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: erpnext
      - name: assets
        emptyDir: {}
