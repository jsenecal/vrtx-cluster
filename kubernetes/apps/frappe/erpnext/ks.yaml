---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app erpnext
  namespace: &namespace frappe
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: mariadb
    - name: redis
  interval: 10m
  path: ./kubernetes/apps/frappe/erpnext/app
  postBuild:
    substitute:
      APP: *app
      GATUS_PATH: /
      GATUS_SUBDOMAIN: erp
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false