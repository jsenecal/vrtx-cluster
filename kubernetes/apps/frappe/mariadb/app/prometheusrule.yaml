---
apiVersion: loki.grafana.com/v1
kind: AlertingRule
metadata:
  name: mariadb-galera-loki
spec:
  interval: 60s
  groups:
    - name: mariadb-galera
      rules:
        - alert: MariaDBGaleraClusterNotHealthy
          expr: |
            sum(rate({kubernetes_namespace="frappe", kubernetes_pod_name=~"mariadb-galera-.*"}
            |~ "(?i)(wsrep_cluster_status|cluster\\s+not\\s+healthy|split.brain|node\\s+disconnected)"
            | __error__="" [5m])) by (kubernetes_pod_name) > 0.1
          for: 5m
          labels:
            severity: critical
            category: database
          annotations:
            summary: "MariaDB Galera cluster is not healthy on {{ $labels.kubernetes_pod_name }}"

        - alert: MariaDBConnectionErrors
          expr: |
            sum(rate({kubernetes_namespace="frappe", kubernetes_pod_name=~"mariadb-galera-.*"}
            |~ "(?i)(too\\s+many\\s+connections|connection\\s+refused|access\\s+denied)"
            | __error__="" [5m])) by (kubernetes_pod_name) > 0.1
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "MariaDB connection errors on {{ $labels.kubernetes_pod_name }}"

        - alert: MariaDBSlowQueries
          expr: |
            sum(rate({kubernetes_namespace="frappe", kubernetes_pod_name=~"mariadb-galera-.*"}
            |~ "(?i)(slow\\s+query|query\\s+took\\s+[0-9]+\\s+seconds)"
            | __error__="" [5m])) by (kubernetes_pod_name) > 0.1
          for: 10m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "MariaDB slow queries detected on {{ $labels.kubernetes_pod_name }}"

        - alert: MariaDBReplicationLag
          expr: |
            sum(rate({kubernetes_namespace="frappe", kubernetes_pod_name=~"mariadb-galera-.*"}
            |~ "(?i)(replication\\s+lag|slave\\s+lag|wsrep_local_recv_queue)"
            | __error__="" [5m])) by (kubernetes_pod_name) > 0.1
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "MariaDB replication lag detected on {{ $labels.kubernetes_pod_name }}"

        - alert: MariaDBBackupFailed
          expr: |
            sum(rate({kubernetes_namespace="frappe", kubernetes_pod_name=~"mariadb-galera-backup-.*"}
            |~ "(?i)(backup\\s+failed|error\\s+during\\s+backup|backup\\s+unsuccessful)"
            | __error__="" [5m])) by (kubernetes_pod_name) > 0
          for: 1m
          labels:
            severity: critical
            category: backup
          annotations:
            summary: "MariaDB backup failed on {{ $labels.kubernetes_pod_name }}"