---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
spec:
  # Root password from secret
  rootPasswordSecretKeyRef:
    name: mariadb-secret
    key: root-password

  # Galera configuration
  galera:
    enabled: true
    primary:
      podIndex: 0
      automaticFailover: true
    sst: mariabackup
    replicaThreads: 1
    config:
      reuseStorageVolume: false
      volumeClaimTemplate:
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 10Gi
        accessModes:
          - ReadWriteOnce

  # Number of replicas for Galera cluster
  replicas: 3

  # Storage configuration
  storage:
    storageClassName: openebs-hostpath
    size: 10Gi
    volumeClaimTemplate:
      accessModes:
        - ReadWriteOnce

  # Service configuration
  service:
    type: ClusterIP

  # Resources
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

  # Pod disruption budget
  podDisruptionBudget:
    maxUnavailable: 1

  # Anti-affinity to spread nodes
  affinity:
    antiAffinityEnabled: true
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: mariadb-galera
          topologyKey: kubernetes.io/hostname

  # Metrics
  metrics:
    enabled: true

  # MariaDB configuration
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=ROW
    innodb_buffer_pool_size=2G
    max_connections=500
    
    # ERPNext specific optimizations
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    
    # Performance tuning
    query_cache_size=0
    query_cache_type=0
    innodb_file_per_table=1
    innodb_flush_log_at_trx_commit=2
    innodb_log_file_size=256M
    
    # Galera performance tuning (operator manages other wsrep settings)
    wsrep_slave_threads=4
    wsrep_log_conflicts=ON
    wsrep_provider_options="gcache.size=1G; gcache.page_size=300M"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: erpnext-db
spec:
  mariaDbRef:
    name: mariadb-galera
  name: erpnext_db
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: erpnext
spec:
  mariaDbRef:
    name: mariadb-galera
  name: erpnext
  passwordSecretKeyRef:
    name: mariadb-secret
    key: erpnext-password
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: erpnext-grant
spec:
  mariaDbRef:
    name: mariadb-galera
  username: erpnext
  database: erpnext_db
  privileges:
    - ALL PRIVILEGES
  grantOption: true