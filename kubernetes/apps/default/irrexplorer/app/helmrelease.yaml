---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# IRR explorer (https://github.com/nlnog/irrexplorer), served as irrexplorer.mtlnog.org through
# cloudflare-tunnel-mtlnog. IRR objects and RPKI status come from NTT's public IRRd; BGP origins
# and RIR stats are imported into irrexplorer-postgres by the import CronJob.
# The image is built from build/irrexplorer by .github/workflows/irrexplorer-image.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app irrexplorer
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      irrexplorer:
        strategy: RollingUpdate
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/jsenecal/irrexplorer
              tag: 2e812de@sha256:b334490915de67a941b3ac06625aba990c4a64fb912018da6a4ee1896080fa9a
            command: ["alembic", "upgrade", "head"]
            env: &env
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: irrexplorer-postgres-app
                    key: uri
              IRRD_ENDPOINT: https://rr.ntt.net/graphql/
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            env: *env
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
      import:
        type: cronjob
        cronjob:
          schedule: 17 */6 * * *
          timeZone: America/Toronto
          activeDeadlineSeconds: 5400
          backoffLimit: 1
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image: *image
            command: ["python", "-c", "import scripts; scripts.import_data()"]
            env: *env
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
            securityContext: *securityContext
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: irrexplorer
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
