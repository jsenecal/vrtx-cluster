---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app code-pod
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      code-pod:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jsenecal/code-pod
              tag: main@sha256:1cacdeb0517ec0093ba06d7c9793708147ec88eecbd7072b71174c80c9f1b6de
            env:
              DOCKER_HOST: unix:///var/run/docker/docker.sock
            envFrom:
              - secretRef:
                  name: code-pod-anthropic-secret
                  optional: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/pgrep", "-x", "sshd"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/pgrep", "-x", "sshd"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/pgrep", "-x", "sshd"]
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: true
              capabilities:
                drop: ["ALL"]
                add:
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SYS_CHROOT
                  - AUDIT_WRITE
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 4Gi
          dind:
            image:
              repository: docker
              tag: dind
            env:
              DOCKER_TLS_CERTDIR: ""
            args:
              - --host=unix:///var/run/docker/docker.sock
              - --storage-driver=overlay2
            securityContext:
              privileged: true
              runAsUser: 0
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["docker", "--host=unix:///var/run/docker/docker.sock", "info"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["docker", "--host=unix:///var/run/docker/docker.sock", "info"]
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          tailscale:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: stable
            env:
              TS_HOSTNAME: vrtx-pod
              TS_USERSPACE: "false"
              TS_STATE_DIR: /var/lib/tailscale
              TS_KUBE_SECRET: ""
              TS_EXTRA_ARGS: --advertise-tags=tag:perso
            envFrom:
              - secretRef:
                  name: code-pod-tailscale-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/local/bin/tailscale", "status", "--peers=false"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/local/bin/tailscale", "status", "--peers=false"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              capabilities:
                add: ["NET_ADMIN", "NET_RAW"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      home:
        existingClaim: code-pod
        advancedMounts:
          code-pod:
            app:
              - path: /home/jsenecal
      workspace:
        existingClaim: code-pod-workspace
        advancedMounts:
          code-pod:
            app:
              - path: /home/jsenecal/Code
      cache:
        type: emptyDir
        advancedMounts:
          code-pod:
            app:
              - path: /home/jsenecal/.cache
      ssh-host-keys:
        existingClaim: code-pod-ssh-host-keys
        advancedMounts:
          code-pod:
            app:
              - path: /var/lib/code-pod/ssh-host-keys
      docker-storage:
        existingClaim: code-pod-docker
        advancedMounts:
          code-pod:
            dind:
              - path: /var/lib/docker
      docker-socket:
        type: emptyDir
        advancedMounts:
          code-pod:
            app:
              - path: /var/run/docker
            dind:
              - path: /var/run/docker
      tailscale-state:
        existingClaim: code-pod-tailscale-state
        advancedMounts:
          code-pod:
            tailscale:
              - path: /var/lib/tailscale
      ssh-seed:
        type: secret
        name: code-pod-ssh-secret
        advancedMounts:
          code-pod:
            app:
              - path: /etc/code-pod/ssh
                readOnly: true
