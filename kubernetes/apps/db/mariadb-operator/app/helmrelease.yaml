---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
spec:
  dependsOn:
    - name: mariadb-operator-crds
  interval: 30m
  chart:
    spec:
      chart: mariadb-operator
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    webhook:
      cert:
        certManager:
          enabled: true
          issuerRef:
            name: cluster-issuer
            kind: ClusterIssuer
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true