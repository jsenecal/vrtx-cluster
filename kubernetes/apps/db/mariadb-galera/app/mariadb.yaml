---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.mariadb.com/mariadb_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-galera-secret
    key: root-password
  
  # Default database and user (required fields, apps can create additional ones)
  database: mariadb
  username: mariadb
  passwordSecretKeyRef:
    name: mariadb-galera-secret
    key: user-password
  
  storage:
    size: 50Gi
    storageClassName: ceph-block
    volumeClaimTemplate:
      accessModes:
        - ReadWriteOnce
  
  replicas: 3
  
  galera:
    enabled: true
    galeraLibPath: /usr/lib/galera/libgalera_smm.so
    replicaThreads: 1
    agent:
      image: docker-registry3.mariadb.com/mariadb-operator/mariadb-operator:25.8.4
      port: 5555
      kubernetesAuth:
        enabled: true
      gracefulShutdownTimeout: 5s
    recovery:
      enabled: true
      minClusterSize: 2
      clusterMonitorInterval: 10s
      clusterHealthyTimeout: 30s
      clusterBootstrapTimeout: 10m
    initContainer:
      image: docker-registry3.mariadb.com/mariadb-operator/mariadb-operator:25.8.4
    config:
      reuseStorageVolume: true
      volumeClaimTemplate:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 300Mi
        storageClassName: ceph-block
  
  service:
    type: ClusterIP
    
  podDisruptionBudget:
    maxUnavailable: 1
    
  updateStrategy:
    type: RollingUpdate
    
  metrics:
    enabled: true
    exporter:
      image: prom/mysqld-exporter:v0.17.2
      port: 9104
      
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: mariadb-galera
            topologyKey: kubernetes.io/hostname