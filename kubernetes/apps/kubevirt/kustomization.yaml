---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubevirt
components:
  - ../../components/common
resources:
  - ./kubevirt/ks.yaml
  - ./cdi/ks.yaml
patches:
  # virt-handler (DS), virt-launcher VM pods, and CDI importer/uploader/cloner
  # pods all need privileged + hostPath; baseline PSA blocks them. Dedicated
  # namespace, so relaxing PSA enforcement here is scoped tightly.
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
