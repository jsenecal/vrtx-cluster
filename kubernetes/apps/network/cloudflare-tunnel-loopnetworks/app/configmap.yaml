---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-loopnetworks-configmap
data:
  config.yaml: |
    ---
    originRequest:
      originServerName: vrtx.${SECRET_DOMAIN_2}

    ingress:
      - hostname: ${SECRET_DOMAIN_2}
        service: &svc https://cilium-gateway-external.kube-system.svc.cluster.local
      - hostname: "*.${SECRET_DOMAIN_2}"
        service: *svc
      - service: http_status:404