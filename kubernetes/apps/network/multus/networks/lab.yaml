---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: multus-lab
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "multus-lab",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.8",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/0", "gw": "192.168.8.1" }
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
