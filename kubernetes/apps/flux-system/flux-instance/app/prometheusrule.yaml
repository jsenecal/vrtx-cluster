---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
  namespace: flux-system
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: |
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 5m
          annotations:
            summary: >-
              Flux instance metric is missing
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: |
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 5m
          annotations:
            summary: >-
              Flux instance {{ $labels.name }} is not ready
          labels:
            severity: critical
    - name: flux-sources.rules
      rules:
        # Replaces the notification-controller event alerts for these kinds, which
        # page on every single failed fetch (e.g. a transient TLS handshake timeout).
        - alert: FluxSourceNotReady
          expr: |
            max by (exported_namespace, kind, name) (
              flux_resource_info{kind=~"HelmRepository|OCIRepository|HelmChart", ready!="True", suspended="False"}
            )
          for: 30m
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has failed to fetch for over 30 minutes
            description: >-
              Flux has been retrying {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              for 30 minutes without success. Check: flux -n {{ $labels.exported_namespace }} get sources all
          labels:
            severity: warning
