---
# Temporary patch to disable automatic OSD creation
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  values:
    cephClusterSpec:
      storage:
        useAllNodes: false
        useAllDevices: false
        # Explicitly define which nodes and devices to use
        nodes:
          - name: vrtx-bravo
            devices:
              - name: "/dev/sdd"  # Existing OSD.0
          - name: vrtx-charlie
            devices:
              - name: "/dev/sdd"  # Existing OSD.2
          # vrtx-alpha is excluded for now