---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-ssd-partitions-parted
  namespace: rook-ceph
spec:
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: vrtx-alpha
      containers:
      - name: partition-creator
        image: ubuntu:22.04
        securityContext:
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x  # Debug mode
          
          # Install required tools
          echo "Installing tools..."
          apt-get update && apt-get install -y parted
          
          # Configuration
          SSD1="/dev/sdc"
          SSD2="/dev/sdd"
          
          echo "Using parted to create partitions..."
          
          # Create partition table and partitions on SSD1
          parted -s $SSD1 mklabel gpt
          parted -s $SSD1 mkpart ceph-db-hdd1 0% 124GB
          parted -s $SSD1 mkpart ceph-db-hdd2 124GB 248GB
          parted -s $SSD1 mkpart ceph-db-hdd3 248GB 372GB
          
          # Create partition table and partitions on SSD2
          parted -s $SSD2 mklabel gpt
          parted -s $SSD2 mkpart ceph-db-hdd4 0% 124GB
          parted -s $SSD2 mkpart ceph-db-hdd5 124GB 248GB
          parted -s $SSD2 mkpart ceph-db-hdd6 248GB 372GB
          
          echo "Partitions created. Showing results..."
          parted $SSD1 print
          parted $SSD2 print
          
          echo "SUCCESS!"