---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-ssd-partitions-debug
  namespace: rook-ceph
spec:
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: vrtx-alpha
      containers:
      - name: partition-creator
        image: ubuntu:22.04
        securityContext:
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x  # Enable debug mode
          
          # Unbuffer output
          exec 1> >(cat)
          exec 2>&1
          
          echo "Starting partition script..."
          
          # Install required tools
          echo "Installing tools..."
          apt-get update && apt-get install -y gdisk parted
          
          # Configuration
          PARTITION_SIZE="124G"
          SSD1="/dev/sdc"
          SSD2="/dev/sdd"
          
          echo "Configuration set"
          echo "SSD1=$SSD1"
          echo "SSD2=$SSD2"
          
          # Check if devices exist
          echo "Checking if $SSD1 exists..."
          ls -la $SSD1
          echo "Checking if $SSD2 exists..."
          ls -la $SSD2
          
          echo "About to start wiping..."
          
          # Try wiping with more verbose output
          echo "Wiping $SSD1..."
          sgdisk --zap-all "$SSD1" 2>&1
          echo "Exit code: $?"
          
          echo "Wiping $SSD2..."
          sgdisk --zap-all "$SSD2" 2>&1
          echo "Exit code: $?"
          
          echo "Wiping complete"