---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.18.8
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          osd_memory_target: "12884901888" # 12GB to leave headroom under 16GB limit
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
          crushLocationLabels:
            - kubernetes.io/hostname
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: false  # Can't use true since we need to exclude alpha
        useAllDevices: false
        devicePathFilter: "^/dev/disk/by-path/pci-0000:(09|14):.*"
        config:
          osdsPerDevice: "1"
        nodes:
          - name: vrtx-bravo
            devices:
              # Dual paths to same disk for redundancy
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:1:0"  # OSD.0
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:1:0"  # OSD.0 (same disk)
          - name: vrtx-charlie
            devices:
              # Dual paths to same disk for redundancy
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:2:0"  # OSD.2
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:2:0"  # OSD.2 (same disk)
          - name: vrtx-alpha
            devices:
              # All available VDs on vrtx-alpha (dual paths each)
              # SSDs - VD 3, 4, 5 (399GB)
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:3:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:3:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:4:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:4:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:5:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:5:0"
              # HDDs - VD 7, 8, 13, 14, 15 (1.2TB)
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:7:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:7:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:8:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:8:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:13:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:13:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:14:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:14:0"
              - name: "/dev/disk/by-path/pci-0000:09:00.0-scsi-0:2:15:0"
              - name: "/dev/disk/by-path/pci-0000:14:00.0-scsi-0:2:15:0"
      resources:
        osd:
          limits:
            memory: 16Gi
          requests:
            cpu: "8"
            memory: 16Gi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    # cephFileSystems: []
    cephObjectStores: []
