---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-ssd-partitions-force
  namespace: rook-ceph
spec:
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: vrtx-alpha
      containers:
      - name: partition-creator
        image: ubuntu:22.04
        securityContext:
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          
          # Install required tools
          echo "Installing tools..."
          apt-get update && apt-get install -y gdisk parted lsof util-linux
          
          # Configuration
          PARTITION_SIZE="124G"
          SSD1="/dev/sdc"
          SSD2="/dev/sdd"
          
          echo "Checking what's using the devices..."
          lsof $SSD1 2>/dev/null || true
          lsof $SSD2 2>/dev/null || true
          
          echo "Checking for mounted partitions..."
          mount | grep -E "(sdc|sdd)" || true
          
          echo "Checking for device mapper usage..."
          dmsetup ls 2>/dev/null | grep -E "(sdc|sdd)" || true
          
          echo "Checking for existing partitions..."
          ls -la /dev/sdc* 2>/dev/null || true
          ls -la /dev/sdd* 2>/dev/null || true
          
          # Force remove any existing signatures
          echo "Removing any existing signatures..."
          wipefs -a -f $SSD1 2>/dev/null || true
          wipefs -a -f $SSD2 2>/dev/null || true
          
          # Try using dd to wipe the partition table area
          echo "Wiping partition table areas with dd..."
          dd if=/dev/zero of=$SSD1 bs=1M count=100 2>&1 || true
          dd if=/dev/zero of=$SSD2 bs=1M count=100 2>&1 || true
          
          # Now try sgdisk
          echo "Creating new GPT tables..."
          sgdisk -o $SSD1
          sgdisk -o $SSD2
          
          # Create partitions
          echo "Creating partitions on $SSD1..."
          sgdisk -n 1:0:+$PARTITION_SIZE -c 1:"ceph-db-hdd1" -t 1:8300 "$SSD1"
          sgdisk -n 2:0:+$PARTITION_SIZE -c 2:"ceph-db-hdd2" -t 2:8300 "$SSD1"
          sgdisk -n 3:0:+$PARTITION_SIZE -c 3:"ceph-db-hdd3" -t 3:8300 "$SSD1"
          
          echo "Creating partitions on $SSD2..."
          sgdisk -n 1:0:+$PARTITION_SIZE -c 1:"ceph-db-hdd4" -t 1:8300 "$SSD2"
          sgdisk -n 2:0:+$PARTITION_SIZE -c 2:"ceph-db-hdd5" -t 2:8300 "$SSD2"
          sgdisk -n 3:0:+$PARTITION_SIZE -c 3:"ceph-db-hdd6" -t 3:8300 "$SSD2"
          
          echo "Reloading partition tables..."
          partprobe $SSD1 $SSD2
          
          sleep 2
          
          echo "Final partition layout:"
          lsblk $SSD1 $SSD2
          
          echo "SUCCESS: Partitions created!"