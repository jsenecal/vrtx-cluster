---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: smartctl-exporter
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.19.0
  url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    config:
      # Only poll the Optane NVMe and the blade-local PERC H730 disks.
      # sd* are Shared PERC8 virtual disks (plus the local H730 VD, which
      # never answers). Concurrent SMART queries to the Shared PERC8 from
      # several blades freeze ALL chassis disk I/O for ~6s, which shows up
      # as BLUESTORE_SLOW_OP_ALERT on every OSD. Drive health for the
      # shared disks comes from the CMC instead.
      device_include: ^(nvme[0-9]+|bus_[0-9]+_megaraid_[0-9]+)$
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: false