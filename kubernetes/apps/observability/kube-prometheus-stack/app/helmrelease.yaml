---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 87.21.0
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        KubeClientCertificateExpiration: true
      rules:
        kubeApiserverAvailability: false  # Disable expensive 30d rules
        kubeApiserverBurnrate: true       # Keep burnrate but it will use shorter windows
    alertmanager:
      route:
        main:
          enabled: true
          hostnames: ["alertmanager.k8s.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://alertmanager.k8s.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.k8s.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
          - promql-experimental-functions
        retention: 60d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            memory: 8Gi
        evaluationInterval: 30s
        scrapeInterval: 30s
        queryTimeout: 2m
        queryMaxConcurrency: 20
        queryMaxSamples: 50000000
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 100Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: High rate of Spegel cache misses for Docker Hub
                  description: >-
                    {{ $value | humanize }} Docker Hub cache misses per minute
                    detected via Spegel, indicating direct upstream pulls that
                    count against the Docker Hub rate limit.
                expr: sum(rate(spegel_mirror_requests_total{registry="docker.io",cache="miss"}[5m])) * 60 > 10
                for: 15m
                labels:
                  severity: warning
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
      io-monitoring-rules:
        groups:
          - name: io-monitoring
            rules:
              - alert: HighNodeIOWait
                annotations:
                  summary: High IO wait ({{$value | printf "%.1f"}}%) on node {{$labels.instance}}
                expr: (avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100) > 20
                for: 5m
                labels:
                  severity: warning
              - alert: HighNodeIOWaitCritical
                annotations:
                  summary: Critical IO wait ({{$value | printf "%.1f"}}%) on node {{$labels.instance}}
                expr: (avg by (instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100) > 40
                for: 5m
                labels:
                  severity: critical
              - alert: HighDiskUtilization
                annotations:
                  summary: Disk {{$labels.device}} on {{$labels.instance}} is {{$value | printf "%.1f"}}% utilized
                  description: >-
                    Disk {{$labels.device}} on {{$labels.instance}} is {{$value | printf "%.1f"}}% utilized.
                    For RBD devices, check which pod is using it:
                    kubectl get pv -o custom-columns=PV:.metadata.name,DEVICE:.spec.csi.volumeAttributes.imageName,CLAIM:.spec.claimRef.name,NAMESPACE:.spec.claimRef.namespace | grep -E "rbd|{{$labels.device}}"
                expr: (rate(node_disk_io_time_seconds_total[5m]) * 100) > 80
                for: 15m
                labels:
                  severity: warning
              - alert: PrometheusHighCompactionTime
                annotations:
                  summary: Prometheus compaction taking {{$value | printf "%.0f"}} seconds (99th percentile)
                expr: histogram_quantile(0.99, rate(prometheus_tsdb_compaction_duration_seconds_bucket[10m])) > 60
                for: 10m
                labels:
                  severity: warning
              - alert: CephOSDHighReadIOPS
                annotations:
                  summary: OSD {{$labels.ceph_daemon}} has high read IOPS ({{$value | printf "%.0f"}} ops/sec)
                expr: sum by (ceph_daemon) (rate(ceph_osd_op_r[5m])) > 1000
                for: 5m
                labels:
                  severity: warning
              - alert: CephOSDUnbalancedLoad
                annotations:
                  summary: Ceph OSD load is unbalanced (max is {{$value | printf "%.1f"}}x higher than min)
                expr: (max(sum by (ceph_daemon) (rate(ceph_osd_op_r[5m]))) / ignoring(ceph_daemon) group_left min(sum by (ceph_daemon) (rate(ceph_osd_op_r[5m]))) > 0.1) > 10 and max(sum by (ceph_daemon) (rate(ceph_osd_op_r[5m]))) > 50
                for: 20m
                labels:
                  severity: warning
