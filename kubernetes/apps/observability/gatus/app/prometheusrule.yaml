---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |
            gatus_results_endpoint_success{group=~"Public Services|Infrastructure"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint ({{ $labels.group }}) is down
          labels:
            severity: critical

        - alert: GatusInternalEndpointDown
          expr: |
            gatus_results_endpoint_success{group=~"Internal Services|IoT"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint ({{ $labels.group }}) is down
          labels:
            severity: warning
