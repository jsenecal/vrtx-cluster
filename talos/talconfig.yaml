# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: vrtx-cluster

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.168.200:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.168.200"
  - "k8s.msrtsmth.io"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "vrtx-alpha"
    ipAddress: "192.168.168.201"
    installDiskSelector:
      wwid: "naa.6d0946600c455c002f9bc187053833b4"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/caf5b14c38258456400d7f4988569406daa804103ac374c21a8938067cec9370
    controlPlane: true

    # Bonded interface configuration
    networkInterfaces:
      # Using device selectors - we need to add separate interfaces for each selector
      # with individual MTU settings
      - deviceSelector:
          busPath: "0000:01:00.*"
        dhcp: false
        mtu: 9000
      # Bond interface with either deviceSelectors, direct interface names, or MAC addresses
      - interface: bond0
        dhcp: false
        mtu: 9000
        vlans:
          - vlanId: 168
            addresses:
              - "192.168.168.201/24"
            mtu: 9000
            routes:
              - network: "0.0.0.0/0"
                gateway: "192.168.168.1"
            vip:
              ip: "192.168.168.200"
          - vlanId: 252
            dhcp: false
            mtu: 1500
          - vlanId: 666
            dhcp: false
            mtu: 1500
          - vlanId: 8
            dhcp: false
            dhcpOptions:
              routeMetric: 1024
            mtu: 1500
        bond:
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: layer3+4
          miimon: 100
          # Using deviceSelectors for bond members (supports wildcards)
          deviceSelectors:
            - busPath: "0000:01:00.*"
    # Talos manifests
    extraManifests:
      - "./manifests/global/lldp-config.yaml"
      - "./manifests/global/ethernet-config.yaml"

