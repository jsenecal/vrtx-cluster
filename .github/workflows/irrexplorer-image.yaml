---
name: IRR explorer Image

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "build/irrexplorer/**"
      - ".github/workflows/irrexplorer-image.yaml"
  push:
    branches: ["main"]
    paths:
      - "build/irrexplorer/**"
      - ".github/workflows/irrexplorer-image.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/irrexplorer

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: build/irrexplorer/Containerfile
          failure-threshold: warning
          # DL3018: alpine git is only used in a throwaway stage to fetch a pinned commit.
          ignore: DL3018

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/irrexplorer
          file: build/irrexplorer/Containerfile
          push: false
          load: true
          tags: irrexplorer:ci
          cache-from: type=gha,scope=irrexplorer
          cache-to: type=gha,scope=irrexplorer,mode=max

      - name: Smoke test
        run: |
          docker run --rm -e DATABASE_URL=postgresql://x@localhost/x -e IRRD_ENDPOINT=https://rr.ntt.net/graphql/ \
            irrexplorer:ci python -c "import irrexplorer.app, scripts; print('ok')"
          docker run --rm irrexplorer:ci test -f frontend/build/index.html

  push:
    name: Push & Sign
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read upstream ref
        id: ref
        run: |
          ref="$(sed -n 's/^ARG IRREXPLORER_REF=//p' build/irrexplorer/Containerfile)"
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/irrexplorer
          file: build/irrexplorer/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ref.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=irrexplorer
          cache-to: type=gha,scope=irrexplorer,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  success:
    name: Success
    if: ${{ !cancelled() }}
    needs: [build, push]
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped"
