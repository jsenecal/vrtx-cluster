---
name: Code Pod Image

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "build/code-pod/**"
      - ".github/workflows/code-pod-image.yaml"
  push:
    branches: ["main"]
    paths:
      - "build/code-pod/**"
      - ".github/workflows/code-pod-image.yaml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/code-pod

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: build/code-pod/Containerfile
          failure-threshold: warning
          # DL3016: pinning @anthropic-ai/claude-code breaks Renovate tracking.
          # DL3002: sshd is PID 1 and requires root to drop into the user session.
          # DL3064: ARG/ENV USERNAME just holds the login account name, not a secret.
          # DL3066: USER switches to named accounts (builder/jsenecal/root) by design.
          ignore: DL3016,DL3002,DL3064,DL3066

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/code-pod
          file: build/code-pod/Containerfile
          push: false
          load: true
          tags: code-pod:ci
          cache-from: type=gha,scope=code-pod
          cache-to: type=gha,scope=code-pod,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: code-pod:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only: most findings here are Go-stdlib CVEs vendored into
          # third-party binaries (yay, op) — only fixable when upstream rebuilds
          # with a newer Go. Tailnet-only access plus single-user model means
          # gating CI on these is more noise than signal. Re-evaluate if Trivy
          # ever flags something in our own code or in the OS package layer.
          exit-code: "0"
          trivyignores: build/code-pod/.trivyignore

  push:
    name: Push & Sign
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/code-pod
          file: build/code-pod/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=code-pod
          cache-to: type=gha,scope=code-pod,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  success:
    name: Success
    if: ${{ !cancelled() }}
    needs: [build, push]
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped"
